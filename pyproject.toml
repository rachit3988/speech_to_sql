[project]
name = "speech-to-sql"
version = "0.1.0"
description = "Voice-driven, read-only natural-language querying of SQL databases with a Claude agent"
authors = [
    { name = "Rachit Sharma", email = "rachit@me100.in" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22",
    "anthropic>=1.11,<2",
    "asyncpg>=0.31",
    "fastapi>=0.142",
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "prometheus-client>=0.26",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.20",
    "sqlglot>=30.21",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "httpx2>=2.0",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[project.scripts]
speech-to-sql = "speech_to_sql.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: needs a live Postgres (set S2S_TEST_PG_DSN)"]
filterwarnings = ["ignore::DeprecationWarning:aiosqlite"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "BLE"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]
"src/speech_to_sql/demo/**" = ["S311"]
"evals/**" = ["S", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
exclude = ["tests/", "evals/"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true
